name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test FolderLock.sln -c Release --nologo

      - name: Publish app (full, with Windows Hello)
        run: >
          dotnet publish src/FolderLock.App/FolderLock.App.csproj
          -c Release -p:PublishProfile=win-x64 -p:FolderLockHello=true
          -p:Version=${{ github.ref_name }} -o publish/full

      - name: Publish app (lite, no Windows Hello)
        run: >
          dotnet publish src/FolderLock.App/FolderLock.App.csproj
          -c Release -p:PublishProfile=win-x64 -p:FolderLockHello=false
          -p:Version=${{ github.ref_name }} -o publish/lite

      - name: Publish guard service
        run: >
          dotnet publish src/FolderLock.Service/FolderLock.Service.csproj
          -c Release -r win-x64 --self-contained false -o publish/service

      - name: Prepare signing certificate (optional)
        id: signing
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_BASE64)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::notice title=Code signing skipped::未配置 CODE_SIGN_PFX_BASE64，本次发布未签名（守护服务会拒绝启动）。"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "CODE_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item publish/service/FolderLock.Service.exe publish/full/
          Copy-Item publish/service/FolderLock.Service.exe publish/lite/

          Copy-Item README.md, LICENSE publish/full/
          Copy-Item README.md, LICENSE publish/lite/

      # 签名失败会让 sign.ps1 以非零码退出，从而中止整个发布，不会产出签名错误的包。
      - name: Sign binaries
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          .\installer\sign.ps1 -PfxPath $env:CODE_SIGN_PFX -PublishDirectory "publish\full"
          .\installer\sign.ps1 -PfxPath $env:CODE_SIGN_PFX -PublishDirectory "publish\lite"
          Remove-Item -LiteralPath $env:CODE_SIGN_PFX -Force

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          # 便携标记：zip 版数据存 exe 旁 data\（AppPaths.IsPortable），而非 %APPDATA%
          New-Item -ItemType File -Path publish/full/portable.flag, publish/lite/portable.flag -Force | Out-Null

          Compress-Archive -Path publish/full/* -DestinationPath "artifacts/VaultLock-$tag-win-x64.zip" -Force
          Compress-Archive -Path publish/lite/* -DestinationPath "artifacts/VaultLock-$tag-lite-win-x64.zip" -Force

          # 应用内「检查更新」用的单文件 exe（与 Updater.DownloadAsync 的单 exe 替换流程匹配）
          dotnet publish src/FolderLock.App/FolderLock.App.csproj `
            -c Release -p:FolderLockHello=true -p:Version=$tag -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/update-exe
          Copy-Item publish/update-exe/FolderLock.App.exe "artifacts/VaultLock-$tag-win-x64-update.exe"

          # latest.json：应用内检查更新的清单（version 必须剥 v 前缀，Version.TryParse 不认）
          $version = $tag.TrimStart("v")
          $exeUrl = "https://github.com/oMrCat/VaultLock/releases/download/$tag/VaultLock-$tag-win-x64-update.exe"
          $sha = (Get-FileHash "artifacts/VaultLock-$tag-win-x64-update.exe" -Algorithm SHA256).Hash.ToLower()
          @{ version = $version; url = $exeUrl; sha256 = $sha } |
            ConvertTo-Json | Set-Content artifacts/latest.json -Encoding utf8

          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/latest.json
            artifacts/*-update.exe
          generate_release_notes: true
          draft: false
          prerelease: false
